variables:
  IMAGE_REPOSITORY: registry.gitlab.com/solarus-games/solarus-devops
  IMAGE_VERSION: 20250217
  GIT_DEPTH: 1
  MACOS_IMAGE: macos-14-xcode-15

stages:
  - configure
  - build
  - package

###############################################################################
# Linux jobs
###############################################################################

linux-configure:
  stage: configure
  image: $IMAGE_REPOSITORY/linux-build-env:$IMAGE_VERSION
  script:
    - cmake --preset linux
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day

linux-build:
  stage: build
  image: $IMAGE_REPOSITORY/linux-build-env:$IMAGE_VERSION
  script:
    - cmake --build --preset linux
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day

###############################################################################
# macOS jobs
###############################################################################

.macos_saas_runners:
  tags:
    - saas-macos-medium-m1
  image: $MACOS_IMAGE
  before_script:
    - echo "started by ${GITLAB_USER_NAME} / @${GITLAB_USER_LOGIN}"

macos-configure:
  extends: .macos_saas_runners
  stage: configure
  image: $MACOS_IMAGE
  script:
    - brew update
    - brew upgrade
    - brew install coreutils cmake ninja pkg-config sdl2 sdl2_image sdl2_ttf luajit lua@5.1 libvorbis libmodplug physfs glm openal-soft qt@6
    - cmake --preset macos
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day

macos-build:
  extends: .macos_saas_runners
  stage: build
  image: $MACOS_IMAGE
  script:
    - cmake --build --preset macos
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day

macos-package:
  extends: .macos_saas_runners
  stage: package
  image: $MACOS_IMAGE
  script:
    - cpack --preset macos
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day
