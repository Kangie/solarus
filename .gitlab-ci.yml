variables:
  IMAGE_REPOSITORY: registry.gitlab.com/solarus-games/solarus-devops
  IMAGE_VERSION: 20250217
  GIT_DEPTH: 1
  MACOS_IMAGE: macos-15-xcode-16

stages:
  - macos
  - linux

linux:
  stage: linux
  image: $IMAGE_REPOSITORY/linux-build-env:$IMAGE_VERSION
  before_script:
    - echo "started by ${GITLAB_USER_NAME} / @${GITLAB_USER_LOGIN}"
  script:
    - cmake --workflow --preset linux
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day

macos:
  tags:
    - saas-macos-medium-m1
  stage: macos
  image: $MACOS_IMAGE
  before_script:
    - echo "started by ${GITLAB_USER_NAME} / @${GITLAB_USER_LOGIN}"
    - brew update
    - brew install coreutils cmake ninja pkg-config sdl2 sdl2_image sdl2_ttf luajit libvorbis libmodplug physfs glm openal-soft qt@6
  script:
    - cmake --workflow --preset macos
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 day
