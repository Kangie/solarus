#------------------------------------------------------------------------------
# GitLab CI/CD Configuration for the Solarus Quest Editor
#------------------------------------------------------------------------------
# This file configures a pipeline for building and packaging the Solarus Quest
# Editor. An initial prepare stage is used to download build and package
# dependencies. Packaging uses two jobs: staging-install and package.
#
# There are three build targets currently supported:
#
# - Linux 64-bit (using gcc)
# - Windows 32-bit (using MinGW)
# - Windows 64-bit (using MinGW)
#
# Note that only the Windows targets generate redistributable packages.
#------------------------------------------------------------------------------

variables:
  IMAGE_REPOSITORY: registry.gitlab.com/solarus-games/solarus-devops
  IMAGE_VERSION: 20250217
  GIT_DEPTH: 10

stages:
  - prepare
  - build
  - install
  - package

#------------------------------------------------------------------------------
# Template for Generic Prepare Jobs
#------------------------------------------------------------------------------
# An artifact is generated with the contents of the `staging` directory from
# a Solarus engine install job that expires one week after creation unless the
# pipeline is for the most recent commit on a branch or tag.
#
# Jobs must define a `SOLARUS_JOB` variable with the name of the Solarus
# Engine CI/CD install job from which to download the artifact from.
# For releases (based on tags), the same tag name will be used for the Solarus
# Engine install job artifact download, otherwise `dev` will be used. Jobs can
# optionally define a `SOLARUS_REF` variable with a specific Git ref to use
# when downloading the install job artifact.
#------------------------------------------------------------------------------

.prepare:
  image: $IMAGE_REPOSITORY/utilities-env:$IMAGE_VERSION
  stage: prepare
  before_script:
    - |
      if [[ -z $SOLARUS_REF ]]; then
        case $CI_COMMIT_REF_NAME in
          release-*) SOLARUS_REF=$CI_COMMIT_REF_NAME ;;
          *) SOLARUS_REF=${CI_COMMIT_TAG:-dev} ;;
        esac
      fi
    - SOLARUS_ARTIFACTS=$SOLARUS_REPOSITORY/-/jobs/artifacts/$SOLARUS_REF
    - SOLARUS_JOB_ARTIFACT=$SOLARUS_ARTIFACTS/download?job=$SOLARUS_JOB
    - 'echo "Artifact: $SOLARUS_JOB_ARTIFACT"'
  script:
    - TMP_FILE=$(mktemp)
    - wget -O $TMP_FILE $SOLARUS_JOB_ARTIFACT
    - 7za x $TMP_FILE
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - staging
    expire_in: 1 week
  variables:
    GIT_STRATEGY: none  # no repository content is needed
    SOLARUS_REPOSITORY: https://gitlab.com/solarus-games/solarus

#------------------------------------------------------------------------------
# Template for Generic Build Jobs
#------------------------------------------------------------------------------
# An artifact is generated with the contents of the `build` directory that
# expires one week after creation unless the pipeline is for the most recent
# commit on a branch or tag.
#
# Jobs can optionally define a `CMAKE_GEN_EXTRA_FLAGS` variable with extra
# flags to use in CMake during build system generation (default: unset).
#------------------------------------------------------------------------------

.build:
  stage: build
  before_script:
    - export CCACHE_BASEDIR=$CI_PROJECT_DIR
    - export CCACHE_DIR=$CI_PROJECT_DIR/ccache
    - export CCACHE_COMPILERCHECK=content
    - ccache --show-stats
  script:
    - $CMAKE_GEN_CMD -B build $CMAKE_GEN_FLAGS
    - $CMAKE_CMD --build build
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - build
    expire_in: 1 week
  cache:
    key: $CI_JOB_NAME-$CI_COMMIT_REF_SLUG
    paths:
      - ccache
  variables:
    CMAKE_GEN_CMD: cmake
    CMAKE_GEN_FLAGS: >-
      -DCMAKE_STAGING_PREFIX=$CI_PROJECT_DIR/staging
      -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=TRUE
      -DCMAKE_C_COMPILER_LAUNCHER=ccache
      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      $CMAKE_GEN_EXTRA_FLAGS
    CMAKE_CMD: cmake

#------------------------------------------------------------------------------
# Template for Generic Install Jobs
#------------------------------------------------------------------------------
# An artifact is generated with the contents of the `staging` directory that
# expires one month after creation unless the pipeline is for the most recent
# commit on a branch or tag.
#------------------------------------------------------------------------------

.install:
  stage: install
  script:
    - $CMAKE_CMD --install build --strip
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - staging
    expire_in: 1 month
  variables:
    CMAKE_CMD: cmake

#------------------------------------------------------------------------------
# Template for MinGW-based Package Jobs
#------------------------------------------------------------------------------
# An artifact is generated with binaries, libraries and assets required to
# run the Solarus Quest Editor that expires one month after creation unless
# the pipeline is for the most recent commit on a branch or tag.
#
# Jobs must define a `BINARIES` variable with a list of all binary objects
# to include in the package. Jobs can optionally define an `EXTRAS` variable
# with a list of additional files and directories to include in the package.
# Jobs can optionally define a `TEXT_FILES` variable with a list of text
# files to include in the root of the package.
#
# Jobs can optionally define a `BASE_DIR` variable with the name of the base
# directory to create inside the package (default: `solarus`). Jobs must
# define an `ARCH` variable with the MinGW target architecture for packaging.
# Possible values are `i686` (32-bit) or `x86_64` (64-bit). Jobs must also
# define a `PACKAGE_PREFIX` variable with a prefix for the package name.
#
# The generated packages are named `<package-prefix>-<commit-hash>.zip` for
# non-releases (based on commits) or `<package-prefix>-<tag-name>.zip` for
# releases (based on tags). Text files are newline-converted for Windows.
#------------------------------------------------------------------------------

.mingw-package:
  stage: package
  image: $IMAGE_REPOSITORY/mingw-build-env:$IMAGE_VERSION
  before_script:
    - PACKAGE_REF=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - PACKAGE=$PACKAGE_PREFIX-$PACKAGE_REF.zip
    - 'echo "Package: $PACKAGE"'
  script:
    - find staging/share/solarus-quest-editor/assets/initial_quest
        \( -iname "*.dat" -or -iname "*.lua" \)
        -print0 | xargs -0 unix2dos -k -o
    - find sample-quest
        \( -iname "*.txt" -or -iname "*.md" -or
           -iname "*.dat" -or -iname "*.lua" \)
        -print0 | xargs -0 unix2dos -k -o
    - rm -f sample-quest/.gitignore
    - mingw_make_pkg.sh $ARCH $PACKAGE $BASE_DIR $BINARIES
    - if [[ -n $EXTRAS ]]; then pkg_add.sh $PACKAGE $BASE_DIR $EXTRAS; fi
    - if [[ -n $TEXT_FILES ]]; then
        unix2dos -k -o $TEXT_FILES;
        pkg_add.sh $PACKAGE . $TEXT_FILES;
      fi
    - pkg_add.sh $PACKAGE . sample-quest
    - TMP_DIR=$(mktemp -d)
    - mkdir $TMP_DIR/assets
    - mv solarus-doc $TMP_DIR/assets/doc
    - pkg_add.sh $PACKAGE $BASE_DIR $TMP_DIR/assets
    # START-HOTFIX: ensure that the LuaJIT library is used in the package
    - cp /usr/$ARCH-w64-mingw32/bin/luajit-2.1.dll lua51.dll
    - pkg_add.sh $PACKAGE $BASE_DIR lua51.dll
    # END-HOTFIX: will be properly fixed in mingw_make_pkg.sh later  artifacts:
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - $PACKAGE_PREFIX-*.zip
    expire_in: 1 month
  variables:
    BASE_DIR: solarus

#------------------------------------------------------------------------------
# Linux-based Prepare Job (64-bit)
#------------------------------------------------------------------------------

linux-prepare:
  extends: .prepare
  variables:
    SOLARUS_JOB: linux-install

#------------------------------------------------------------------------------
# MinGW-based Prepare Job (64-bit)
#------------------------------------------------------------------------------

mingw-x64-prepare:
  extends: .prepare
  variables:
    SOLARUS_JOB: mingw-x64-install

#------------------------------------------------------------------------------
# MinGW-based Prepare Job (32-bit)
#------------------------------------------------------------------------------

mingw-x86-prepare:
  extends: .prepare
  variables:
    SOLARUS_JOB: mingw-x86-install
  rules:
    - if: $CI_COMMIT_TAG

#------------------------------------------------------------------------------
# Solarus Documentation Prepare Job
#------------------------------------------------------------------------------
# For releases (based on tags), the same tag name will be used for the Solarus
# Documentation build artifact download, otherwise `dev` will be used.
# Jobs can optionally define a `SOLDOC_REF` variable with a specific Git ref
# to use when downloading the docs job artifact.
#------------------------------------------------------------------------------

docs-prepare:
  image: $IMAGE_REPOSITORY/utilities-env:$IMAGE_VERSION
  stage: prepare
  before_script:
    - |
      if [[ -z $SOLDOC_REF ]]; then
        case $CI_COMMIT_REF_NAME in
          release-*) SOLDOC_REF=$CI_COMMIT_REF_NAME ;;
          *) SOLDOC_REF=${CI_COMMIT_TAG:-dev} ;;
        esac
      fi
    - SOLDOC_ARTIFACTS=$SOLARUS_REPOSITORY/-/jobs/artifacts/$SOLDOC_REF
    - SOLDOC_JOB_ARTIFACT=$SOLDOC_ARTIFACTS/download?job=docs-build
    - 'echo "Artifact: $SOLDOC_JOB_ARTIFACT"'
  script:
    - TMP_FILE=$(mktemp)
    - wget -O $TMP_FILE $SOLDOC_JOB_ARTIFACT
    - TMP_DIR=$(mktemp -d)
    - 7za x -o$TMP_DIR $TMP_FILE
    - mv $TMP_DIR/doc/build/html solarus-doc
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - solarus-doc
    expire_in: 1 week
  variables:
    GIT_STRATEGY: none  # no repository content is needed
    SOLARUS_REPOSITORY: https://gitlab.com/solarus-games/solarus

#------------------------------------------------------------------------------
# Sample Quest Prepare Job
#------------------------------------------------------------------------------
# For releases (based on tags), the same tag name will be used for the Sample
# Quest archive download, otherwise `dev` will be used. Jobs can optionally
# define a `SQUEST_REF` variable with a specific Git ref to use when
# downloading the sample-quest archive.
#------------------------------------------------------------------------------

sample-quest-prepare:
  image: $IMAGE_REPOSITORY/utilities-env:$IMAGE_VERSION
  stage: prepare
  before_script:
    - |
      if [[ -z $SQUEST_REF ]]; then
        case $CI_COMMIT_REF_NAME in
          release-*) SQUEST_REF=$CI_COMMIT_REF_NAME ;;
          *) SQUEST_REF=${CI_COMMIT_TAG:-dev} ;;
        esac
      fi
    - SQUEST_ARCHIVE=$SQUEST_REPOSITORY/-/archive/$SQUEST_REF/archive.tgz
    - 'echo "Archive: $SQUEST_ARCHIVE"'
  script:
    - TMP_FILE=$(mktemp)
    - wget -O $TMP_FILE $SQUEST_ARCHIVE
    - mkdir sample-quest
    - tar x -zf $TMP_FILE -C sample-quest --strip-components 1
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - sample-quest
    expire_in: 1 week
  variables:
    GIT_STRATEGY: none  # no repository content is needed
    SQUEST_REPOSITORY: https://gitlab.com/solarus-games/solarus-sample-quest

#------------------------------------------------------------------------------
# Linux-based Build Job (64-bit)
#------------------------------------------------------------------------------

linux-build:
  extends: .build
  image: $IMAGE_REPOSITORY/linux-build-env:$IMAGE_VERSION
  dependencies:
    - linux-prepare

#------------------------------------------------------------------------------
# MinGW-based Build Job (64-bit)
#------------------------------------------------------------------------------

mingw-x64-build:
  extends: .build
  image: $IMAGE_REPOSITORY/mingw-build-env:$IMAGE_VERSION
  dependencies:
    - mingw-x64-prepare
  variables:
    CMAKE_GEN_CMD: x86_64-w64-mingw32-cmake

#------------------------------------------------------------------------------
# MinGW-based Build Job (32-bit)
#------------------------------------------------------------------------------

mingw-x86-build:
  extends: .build
  image: $IMAGE_REPOSITORY/mingw-build-env:$IMAGE_VERSION
  dependencies:
    - mingw-x86-prepare
  variables:
    CMAKE_GEN_CMD: i686-w64-mingw32-cmake
  rules:
    - if: $CI_COMMIT_TAG

#------------------------------------------------------------------------------
# MinGW-based Staging Install Job (64-bit)
#------------------------------------------------------------------------------

mingw-x64-install:
  extends: .install
  image: $IMAGE_REPOSITORY/linux-build-env:$IMAGE_VERSION
  dependencies:
    - mingw-x64-prepare
    - mingw-x64-build

#------------------------------------------------------------------------------
# MinGW-based Staging Install Job (32-bit)
#------------------------------------------------------------------------------

mingw-x86-install:
  extends: .install
  image: $IMAGE_REPOSITORY/mingw-build-env:$IMAGE_VERSION
  dependencies:
    - mingw-x86-prepare
    - mingw-x86-build
  rules:
    - if: $CI_COMMIT_TAG

#------------------------------------------------------------------------------
# MinGW-based Package Job (64-bit)
#------------------------------------------------------------------------------

mingw-x64-package:
  extends: .mingw-package
  dependencies:
    - docs-prepare
    - sample-quest-prepare
    - mingw-x64-install
  variables:
    ARCH: x86_64
    PACKAGE_PREFIX: solarus-x64
    BINARIES: >-
      staging/bin/libsolarus.dll
      staging/bin/libsolarus-gui.dll
      staging/bin/solarus-run.exe
      staging/bin/solarus-launcher.exe
      staging/bin/solarus-quest-editor.exe
    EXTRAS: >-
      staging/share/solarus-gui/translations
      staging/share/solarus-quest-editor/assets
      staging/share/solarus-quest-editor/translations
      /usr/$ARCH-w64-mingw32/lib/qt6/plugins/platforms
      /usr/$ARCH-w64-mingw32/lib/qt6/plugins/styles
      cmake/win32/bzip2.dll
      cmake/win32/zip.exe
    TEXT_FILES: >-
      changelog.md
      license.md
      license_gpl.txt
      cmake/win32/readme.txt

#------------------------------------------------------------------------------
# MinGW-based Package Job (32-bit)
#------------------------------------------------------------------------------

mingw-x86-package:
  extends: .mingw-package
  dependencies:
    - docs-prepare
    - sample-quest-prepare
    - mingw-x86-install
  variables:
    ARCH: i686
    PACKAGE_PREFIX: solarus-x86
    BINARIES: >-
      staging/bin/libsolarus.dll
      staging/bin/libsolarus-gui.dll
      staging/bin/solarus-run.exe
      staging/bin/solarus-launcher.exe
      staging/bin/solarus-quest-editor.exe
    EXTRAS: >-
      staging/share/solarus-gui/translations
      staging/share/solarus-quest-editor/assets
      staging/share/solarus-quest-editor/translations
      /usr/$ARCH-w64-mingw32/lib/qt6/plugins/platforms
      /usr/$ARCH-w64-mingw32/lib/qt6/plugins/styles
      cmake/win32/bzip2.dll
      cmake/win32/zip.exe
    TEXT_FILES: >-
      changelog.md
      license.md
      license_gpl.txt
      cmake/win32/readme.txt
  rules:
    - if: $CI_COMMIT_TAG
